<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سامانه جامع مدیریت مدرسه</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
:root{--bg:#e9edf4;--bg2:#eef1f7;--sd:#c6ccd9;--sl:#fff;--txt:#39435c;--muted:#7b879c;--line:#d7dce6;--pri:#5b7cfa;--pri2:#8b5cf6;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#0ea5e9}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);min-height:100vh;font-family:Vazirmatn,'Segoe UI',Tahoma,sans-serif;font-size:14px}
.neu{background:var(--bg);border-radius:20px;box-shadow:9px 9px 18px var(--sd),-9px -9px 18px var(--sl)}
.neu-s{background:var(--bg);border-radius:14px;box-shadow:5px 5px 10px var(--sd),-5px -5px 10px var(--sl)}
.neu-in{background:var(--bg);border-radius:14px;box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl)}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:400px;padding:34px 28px;border-radius:26px;text-align:center}
.login-logo{width:72px;height:72px;display:grid;place-items:center;font-size:32px;border-radius:22px;margin:0 auto 18px}
.login-card h1{margin:0 0 4px;font-size:1.3rem}.login-sub{color:var(--muted);font-size:.85rem;margin:0 0 22px}
.login-card form{display:flex;flex-direction:column;gap:14px;text-align:right}
.login-hint{margin-top:20px;padding:14px;background:var(--bg2);border-radius:14px;text-align:right;font-size:.75rem;color:var(--muted);line-height:1.9}
#loginErr{color:var(--bad);font-size:.8rem;min-height:18px;text-align:center}
.wrap{display:grid;grid-template-columns:255px 1fr;gap:22px;padding:22px;min-height:100vh;max-width:1600px;margin:0 auto}
@media(max-width:960px){.wrap{grid-template-columns:1fr;padding:14px;gap:14px}}
.side{position:sticky;top:22px;height:calc(100vh - 44px);padding:18px 14px;display:flex;flex-direction:column;gap:16px}
@media(max-width:960px){.side{position:static;height:auto}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.brand .logo{width:44px;height:44px;display:grid;place-items:center;font-size:20px;border-radius:14px}
.brand b{display:block;font-size:.9rem}.brand small{color:var(--muted);font-size:.7rem;display:block}
nav{display:flex;flex-direction:column;gap:5px;overflow:auto;flex:1}
.nav-btn{display:flex;align-items:center;gap:10px;border:0;cursor:pointer;font-family:inherit;font-size:.82rem;color:var(--txt);padding:9px 12px;border-radius:13px;background:var(--bg);box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);transition:.15s;text-align:right}
.nav-btn span{font-size:1rem}.nav-btn:hover{color:var(--pri)}
.nav-btn.active{color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:5px 5px 12px #bfc6d6,-4px -4px 10px var(--sl)}
.nav-btn .nav-badge{margin-right:auto;background:var(--bad);color:#fff;font-size:.68rem;padding:1px 6px;border-radius:8px;font-weight:700}
.nav-btn.active .nav-badge{background:#fff;color:var(--bad)}
.side-foot{display:flex;flex-direction:column;gap:9px}
.btn{border:0;cursor:pointer;border-radius:14px;padding:10px 16px;font-family:inherit;font-size:.85rem;background:var(--bg);color:var(--txt);box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{color:var(--pri)}.btn:active{box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl)}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:5px 5px 12px #c0c7d7,-4px -4px 10px var(--sl)}
.btn.primary:hover{color:#fff;filter:brightness(1.05)}
.btn.ok{color:#fff;background:linear-gradient(135deg,#34d399,#22c55e)}
.btn.bad{color:#fff;background:linear-gradient(135deg,#f87171,#ef4444)}
.btn.warn{color:#fff;background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.btn.sm{padding:6px 11px;font-size:.76rem;border-radius:11px}
.btn.full{width:100%}
main{display:flex;flex-direction:column;gap:20px;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;padding:9px 14px;flex:1;min-width:200px}
.search input{border:0;background:transparent;outline:none;font-family:inherit;font-size:.86rem;color:var(--txt);width:100%}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{padding:8px 14px;font-size:.78rem;color:var(--muted);border-radius:12px}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px}
.user-chip .av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));font-weight:700;font-size:.85rem}
.card{padding:20px;margin-bottom:20px;border-radius:20px}
.card h3{margin:0 0 16px;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:16px;margin-bottom:20px}
.stat{padding:14px 16px;border-radius:20px}
.stat .i{font-size:1.3rem}.stat .t{font-size:.74rem;color:var(--muted);margin-top:8px}
.stat .v{font-size:1.4rem;font-weight:700;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:800px){.grid3{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted)}
.fld.full{grid-column:1/-1}
.fld input,.fld select,.fld textarea{border:0;outline:none;font-family:inherit;font-size:.86rem;color:var(--txt);padding:10px 13px;border-radius:13px;background:var(--bg);box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl)}
.fld input:focus,.fld select:focus,.fld textarea:focus{box-shadow:inset 4px 4px 8px var(--sd),inset -4px -4px 8px var(--sl),0 0 0 2px #b9c6f7}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:.83rem}
.tbl th{font-weight:600;color:var(--muted);text-align:right;padding:4px 12px;font-size:.75rem;white-space:nowrap}
.tbl td{background:var(--bg2);padding:11px 12px;vertical-align:middle}
.tbl tbody tr td:first-child{border-radius:0 14px 14px 0}
.tbl tbody tr td:last-child{border-radius:14px 0 0 14px}
.tbl tbody tr:hover td{background:#e6eaf3}
.tbl tbody tr.tr-present td{background:#e9f9ee}.tbl tbody tr.tr-absent td{background:#fdecec}
.tbl tbody tr.tr-late td{background:#fef7e6}.tbl tbody tr.tr-leave td{background:#e8f5fe}
.tbl-wrap{overflow-x:auto}
.badge{display:inline-block;padding:4px 10px;border-radius:10px;font-size:.72rem;font-weight:600}
.b-ok{background:#dcfce7;color:#15803d}.b-bad{background:#fee2e2;color:#b91c1c}
.b-warn{background:#fef3c7;color:#b45309}.b-info{background:#e0f2fe;color:#0369a1}
.b-mut{background:#e5e9f2;color:#5b6478}.b-pri{background:#e0e7ff;color:#4338ca}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.att-card{padding:12px 14px;border-radius:16px;display:flex;flex-direction:column;gap:10px}
.att-card .nm{font-size:.85rem;font-weight:600}
.att-btns{display:flex;gap:6px;flex-wrap:wrap}
.att-btns button{flex:1;min-width:52px;border:0;cursor:pointer;font-family:inherit;font-size:.72rem;padding:7px 4px;border-radius:10px;background:var(--bg);color:var(--muted);box-shadow:3px 3px 6px var(--sd),-3px -3px 6px var(--sl)}
.att-btns button.on[data-s="حاضر"]{background:linear-gradient(135deg,#34d399,#22c55e);color:#fff;box-shadow:none}
.att-btns button.on[data-s="غایب"]{background:linear-gradient(135deg,#f87171,#ef4444);color:#fff;box-shadow:none}
.att-btns button.on[data-s="تاخیر"]{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;box-shadow:none}
.att-btns button.on[data-s="مرخصی"]{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff;box-shadow:none}
.modal-bg{position:fixed;inset:0;background:rgba(57,67,92,.32);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;z-index:99}
.modal{width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:22px;border-radius:22px;animation:pop .18s ease;background:var(--bg)}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{margin:0;font-size:1rem}
.modal-foot{display:flex;gap:10px;justify-content:flex-start;margin-top:20px;flex-wrap:wrap}
.icon-btn{border:0;cursor:pointer;width:34px;height:34px;border-radius:11px;background:var(--bg);color:var(--muted);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl);font-family:inherit}
#toasts{position:fixed;bottom:22px;left:22px;display:flex;flex-direction:column;gap:10px;z-index:200;max-width:340px}
.toast{padding:12px 18px;border-radius:14px;font-size:.82rem;background:var(--bg);box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl);animation:slide .2s ease}
@keyframes slide{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.ok{border-right:4px solid var(--ok)}.toast.bad{border-right:4px solid var(--bad)}
.toast.warn{border-right:4px solid var(--warn)}.toast.info{border-right:4px solid var(--info)}
.empty{text-align:center;color:var(--muted);padding:34px;font-size:.85rem}
.bar{height:9px;border-radius:9px;background:var(--bg);box-shadow:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.hint{font-size:.75rem;color:var(--muted);line-height:1.9}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:12px;font-size:.78rem;background:var(--bg);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl);cursor:pointer}
.chip.on{color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:none}
.msg-item{padding:14px 16px;border-radius:16px;margin-bottom:10px;background:var(--bg2);border-right:4px solid var(--line)}
.msg-item.urgent{border-right-color:var(--bad)}.msg-item.high{border-right-color:var(--warn)}
.msg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.msg-body{font-size:.84rem;line-height:1.9;white-space:pre-wrap}
.msg-meta{font-size:.72rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.welcome{padding:34px 28px;text-align:center;border-radius:22px;background:linear-gradient(135deg,#eef2ff,#f5eefb);border:2px dashed #c7d2fe;margin-bottom:20px}
.welcome h2{margin:0 0 8px;font-size:1.2rem}.welcome p{margin:0 0 20px;color:var(--muted);font-size:.85rem;line-height:1.9}
.welcome .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:20px}
.welcome .step{background:#fff;padding:14px;border-radius:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.welcome .step .n{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;margin:0 auto 8px;font-weight:700}
.welcome .step .t{font-size:.82rem;font-weight:600}
.welcome .step .d{font-size:.72rem;color:var(--muted);margin-top:4px;line-height:1.6}
.lock-notice{padding:10px 14px;background:#fef3c7;border-radius:12px;font-size:.76rem;color:#92400e;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.lock-notice::before{content:'🔒';font-size:1.1rem}
.tabs-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab-chip{padding:8px 14px;border:0;cursor:pointer;font-family:inherit;font-size:.8rem;border-radius:11px;background:var(--bg);color:var(--muted);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--sl)}
.tab-chip.active{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:none}
.tt-grid{display:grid;grid-template-columns:90px repeat(6,1fr);gap:6px;font-size:.76rem}
.tt-cell{padding:10px;background:var(--bg2);border-radius:10px;min-height:52px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.tt-cell.head{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:700}
.tt-cell .sub{font-size:.68rem;color:var(--muted);margin-top:3px}
#printSheet{display:none}
@media print{
  @page{size:A4 portrait;margin:5mm}
  html,body{background:#fff!important;margin:0;padding:0}
  #app,#loginScreen,.modal-bg,#toasts{display:none!important}
  #printSheet{display:block!important;width:200mm;direction:rtl;color:#000;font-family:Vazirmatn,Tahoma,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ps-head{border-bottom:.4mm solid #000;padding-bottom:1mm;margin-bottom:1.5mm}
  .ps-h1{display:flex;justify-content:space-between;align-items:baseline;font-size:10pt;font-weight:700}
  .ps-h2{font-size:8pt;margin-top:.6mm}.ps-h3{font-size:6.5pt;margin-top:.6mm;display:flex;gap:4mm;flex-wrap:wrap}
  .ps-legend{font-size:5.6pt;color:#444;margin-top:.5mm}
  .ps-body{column-count:var(--cols,2);column-gap:2.5mm;column-rule:.15mm solid #aaa;column-fill:auto;font-size:var(--fs,8pt);line-height:1.12}
  .ps-row{display:flex;align-items:center;gap:.7mm;padding:.35mm 0;border-bottom:.12mm solid #cfcfcf;break-inside:avoid;page-break-inside:avoid}
  .ps-i{width:3.6mm;flex:none;color:#555;font-size:calc(var(--fs) * .82)}
  .ps-n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ps-s{display:flex;gap:.15mm;flex:none}
  .ps-c{width:2.6mm;height:2.6mm;border-radius:50%;border:.22mm solid #555;display:inline-flex;align-items:center;justify-content:center;font-size:calc(var(--fs) * .72);line-height:1;color:#333}
  .ps-c.on{background:#111;color:#fff;border-color:#111}
  .ps-foot{margin-top:2mm;border-top:.3mm solid #000;padding-top:1mm;display:flex;justify-content:space-between;align-items:flex-end;font-size:6.5pt}
  .ps-sign{min-width:60mm;border-bottom:.2mm dotted #333;height:5mm;display:inline-block;width:55mm}
  .ps-table{width:100%;border-collapse:collapse;font-size:8pt}
  .ps-table th,.ps-table td{border:.2mm solid #333;padding:1mm 1.5mm;text-align:center}
  .ps-table th{background:#e8e8e8}
  .ps-title{font-size:12pt;font-weight:700;text-align:center;margin-bottom:2mm}
  .ps-info{font-size:8pt;margin-bottom:2mm;display:flex;gap:5mm;flex-wrap:wrap}
  .ps-info b{font-weight:700}
}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-card neu">
    <div class="login-logo neu-in">🏫</div>
    <h1>سامانه جامع مدرسه</h1>
    <p class="login-sub">ورود به سیستم</p>
    <form id="loginForm" onsubmit="doLogin(event)">
      <label class="fld"><span>نام کاربری</span><input id="loginUser" autocomplete="username" required></label>
      <label class="fld"><span>رمز عبور</span><input id="loginPass" type="password" autocomplete="current-password" required></label>
      <div id="loginErr"></div>
      <button class="btn primary full" type="submit">🔐 ورود</button>
    </form>
    <div class="login-hint">
      <p style="margin:0 0 6px;font-weight:600;color:var(--txt)">راهنمای ورود اولیه:</p>
      <small>مدیر: <b>admin</b> / <b>admin</b></small><br>
      <small>پس از ورود، از بخش «کاربران» حساب‌های دیگر را بسازید.</small>
    </div>
  </div>
</div>

<div id="app" class="wrap" style="display:none">
  <aside class="side neu">
    <div class="brand">
      <div class="logo neu-in">🏫</div>
      <div><b id="brandName">سامانه مدرسه</b><small id="brandYear">—</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="btn full" onclick="exportExcel()">⬇️ خروجی اکسل</button>
      <label class="btn full" style="cursor:pointer">⬆️ ورود اکسل<input type="file" id="xlsIn" accept=".xlsx,.xls,.csv" hidden></label>
      <button class="btn full bad" onclick="doLogout()">🚪 خروج</button>
    </div>
  </aside>
  <main>
    <header class="topbar neu">
      <div class="search neu-in"><span>🔎</span><input id="q" placeholder="جستجو..."></div>
      <div class="top-actions">
        <span class="pill neu-s" id="datePill"></span>
        <div class="user-chip neu-s"><div class="av" id="avatar">؟</div><div><b id="userName" style="font-size:.83rem">—</b><small style="display:block;color:var(--muted);font-size:.7rem" id="userRole">—</small></div></div>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="printSheet"></div>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ================================================================
   1) ابزار پایه
   ================================================================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const isoToday = () => new Date().toISOString().slice(0,10);
const faDate = d => { if(!d) return '—'; try{ return new Date(d).toLocaleDateString('fa-IR'); }catch(e){ return d; } };
const money = n => (Number(n)||0).toLocaleString('fa-IR');
const num = n => (Number(n)||0).toLocaleString('fa-IR');
const toFa = n => String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const normName = sn => String(sn||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').replace(/\s+/g,' ').trim();

const LS = 'school_v2';
const SESSION = 'school_v2_session';
let DB = {};
let CU = null;

const ROLES = {
  admin:   {label:'مدیر',    color:'#8b5cf6'},
  vice:    {label:'معاون',   color:'#5b7cfa'},
  teacher: {label:'دبیر',    color:'#0ea5e9'},
  staff:   {label:'پرسنل',   color:'#22c55e'},
  parent:  {label:'والدین',  color:'#f59e0b'}
};

/* ================================================================
   2) دیتابیس (شروع با فقط ادمین)
   ================================================================ */
function emptyDB(){
  return {
    settings:{ school:'نام مدرسه شما', year:'1405-1406', viceName:'معاون آموزشی', address:'', phone:'' },
    users: [
      {id:'u_admin', username:'admin', password:'admin', role:'admin', name:'مدیر مدرسه', active:true}
    ],
    classes:[], subjects:[], students:[], teachers:[],
    attendance:[], grades:[], homework:[], exams:[],
    payments:[], discounts:[], expenses:[],
    commitments:[], discipline:[], gates:[],
    messages:[], objections:[], announcements:[], events:[], meetings:[],
    schedule:[], library:{books:[],loans:[]}
  };
}

function save(){ try{ localStorage.setItem(LS, JSON.stringify(DB)); }catch(e){ toast('خطا در ذخیره‌سازی','bad'); } }

function load(){
  const raw = localStorage.getItem(LS);
  if(raw){ try{ DB = JSON.parse(raw); }catch(e){ DB = null; } }
  if(!DB || !DB.users){ DB = emptyDB(); save(); }
  migrate();
}

function migrate(){
  const def = emptyDB();
  Object.keys(def).forEach(k=>{ if(!(k in DB)) DB[k] = def[k]; });
  if(!DB.library) DB.library = {books:[],loans:[]};
  if(!DB.library.books) DB.library.books = [];
  if(!DB.library.loans) DB.library.loans = [];
  if(!DB.users.find(u=>u.role==='admin')){
    DB.users.push({id:'u_admin', username:'admin', password:'admin', role:'admin', name:'مدیر مدرسه', active:true});
  }
  save();
}

/* ================================================================
   3) دسترسی‌ها
   ================================================================ */
const PERMS = {
  editUsers:      r => r==='admin',
  editStudents:   r => r==='admin',
  editTeachers:   r => r==='admin',

/* ================================================================
   4) Toast & Modal
   ================================================================ */
function toast(msg, type='ok'){
  const d = document.createElement('div');
  d.className = 'toast '+type;
  d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='.3s'; setTimeout(()=>d.remove(),320); }, 3000);
}

function modal(title, html, onOk, okText='ذخیره', wide){
  const m = document.createElement('div');
  m.className = 'modal-bg';
  m.innerHTML = `<div class="modal ${wide?'wide':''} neu">
      <div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-close>✕</button></div>
      <div class="modal-body">${html}</div>
      <div class="modal-foot">
        ${onOk ? `<button class="btn primary" data-ok>${okText}</button>` : ''}
        <button class="btn" data-close>بستن</button>
      </div>
    </div>`;
  document.body.appendChild(m);
  m.addEventListener('click', e=>{
    if(e.target === m || e.target.closest('[data-close]')) m.remove();
    if(e.target.closest('[data-ok]')){
      if(onOk && onOk(m) === false) return;
      m.remove();
    }
  });
  const f = m.querySelector('input,select,textarea'); if(f) setTimeout(()=>f.focus(),60);
  return m;
}

const discountOf = id => DB.discounts.filter(d=>d.studentId===id).reduce((s,d)=>s+(+d.amount||0),0);

function filteredStudents(){
  const q = state.q.trim();
  return DB.students.filter(s=>{
    if(state.cls !== 'all' && s.classId !== state.cls) return false;
    if(!q) return true;
    const c = getCls(s.classId);
    return (s.name+' '+s.nid+' '+s.mobile+' '+c.name).includes(q);
  }).sort((a,b)=> a.name.localeCompare(b.name,'fa'));
}

function vStudents(){
  const list = filteredStudents();
  const per = 50;
  const pages = Math.max(1, Math.ceil(list.length/per));
  if(state.page > pages) state.page = pages;
  const slice = list.slice((state.page-1)*per, state.page*per);
  const editable = can('editStudents');

  const opts = ['<option value="all">همه کلاس‌ها</option>']
    .concat(DB.classes.map(c=>`<option value="${c.id}" ${state.cls===c.id?'selected':''}>${esc(c.name)}</option>`)).join('');

  const rows = slice.map((s,i)=>{
    const c = getCls(s.classId);
    const rem = remainingOf(s);
    return `<tr>
      <td>${num((state.page-1)*per + i + 1)}</td>
      <td><b>${esc(s.name)}</b></td>
      <td dir="ltr">${esc(s.nid)||'—'}</td>
      <td dir="ltr">${esc(s.mobile)||'—'}</td>
      <td>${esc(c.name)}</td>
      <td>${rem>0?`<span class="badge b-warn">${money(rem)}</span>`:'<span class="badge b-ok">تسویه</span>'}</td>
      <td style="white-space:nowrap">
        <button class="btn sm" onclick="viewStudent('${s.id}')">👁️</button>
        ${editable ? `<button class="btn sm" onclick="editStudent('${s.id}')">✏️</button>
        <button class="btn sm bad" onclick="delStudent('${s.id}')">🗑️</button>` : ''}
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="card neu">
    <h3>🎓 دانش‌آموزان <span class="badge b-info">${num(list.length)}</span></h3>
    ${!editable ? `<div class="lock-notice">فقط مدیر می‌تواند دانش‌آموزان را اضافه/ویرایش/حذف کند.</div>` : ''}

      </table>

function pager(total, page){
  const per = 50, pages = Math.max(1, Math.ceil(total/per));
  if(pages<=1) return '';
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:16px">
    ${Array.from({length:pages},(_,i)=>i+1).map(b=>`<button class="btn sm ${b===page?'primary':''}" onclick="state.page=${b};render()">${num(b)}</button>`).join('')}
  </div>`;
}

    <label class="fld"><span>شهریه (تومان)</span><input name="fee" type="number" min="0" value="0"></label>
    <label class="fld"><span>نام ولی</span><input name="guardian"></label>

    <label class="fld full"><span><input type="checkbox" name="makeAccount" checked> ساخت خودکار حساب کاربری والدین</span></label>
  </div>`;
  modal('➕ افزودن دانش‌آموز', html, m=>{
    const name = $('[name=name]',m).value.trim();
    if(!name){ toast('نام الزامی','bad'); return false; }
    const mobile = $('[name=mobile]',m).value.trim();
    const nid = $('[name=nid]',m).value.trim();
    const s = {id:uid(), name, nid, mobile,
      classId: $('[name=classId]',m).value,
      fee: +$('[name=fee]',m).value || 0,
      guardian: $('[name=guardian]',m).value.trim(),
      note: $('[name=note]',m).value.trim()};
    DB.students.push(s);
    let accountInfo = '';
    if($('[name=makeAccount]',m).checked){
      const existing = new Set(DB.users.map(u=>u.username));
      let base = mobile || nid || ('p'+Math.random().toString(36).slice(2,7));
      const uname = makeUsername(base, existing);
      const pass = mobile && mobile.length>=4 ? mobile.slice(-4) : (nid && nid.length>=4 ? nid.slice(-4) : '1234');
      DB.users.push({id:uid(), username:uname, password:pass, role:'parent', name:'ولی '+name, studentId:s.id, active:true});
      accountInfo = ` | کاربری: ${uname} / ${pass}`;
    }
    save(); render();
    toast('دانش‌آموز اضافه شد'+accountInfo,'ok');
  });
}

function makeUsername(base, existing){
  base = String(base||'').replace(/[^a-zA-Z0-9]/g,'');
  if(!base) base = 'u'+Math.random().toString(36).slice(2,7);
  let u = base, n = 1;
  while(existing.has(u)){ u = base+n; n++; }
  existing.add(u);
  return u;
}

      ${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===u.role?'selected':''}>${v.label}</option>`).join('')}
    </select></label>
  </div>`;
  modal('✏️ ویرایش کاربر', html, m=>{
    const un = $('[name=username]',m).value.trim();

    u.username = un;
    u.password = $('[name=password]',m).value;
    if(u.role!=='admin') u.role = $('[name=role]',m).value;
    save(); render(); toast('ویرایش شد');
  });
}
function toggleUser(id){
  if(!requireAdmin()) return;
  const u = DB.users.find(x=>x.id===id); if(!u) return;
  if(u.id===CU.id){ toast('حساب خودتان را نمی‌توانید غیرفعال کنید','bad'); return; }
  u.active = !u.active;
  save(); render(); toast(u.active?'فعال شد':'غیرفعال شد','warn');
}
function delUser(id){
  if(!requireAdmin()) return;
  const u = DB.users.find(x=>x.id===id); if(!u) return;
  if(u.id===CU.id){ toast('حساب خودتان را نمی‌توانید حذف کنید','bad'); return; }
  if(!confirm(`کاربر «${u.name}» حذف شود؟`)) return;
  DB.users = DB.users.filter(x=>x.id!==id);
  save(); render(); toast('حذف شد','warn');
}

   ================================================================ */
function attSet(k,v){ attState[k]=v; render(); }

function setAtt(sid, status){
  if(!can('manageAttendance')) return;
  const date = attState.date;
  const i = DB.attendance.findIndex(a=>a.studentId===sid && a.date===date);
  if(i>=0){ DB.attendance[i].status = status; DB.attendance[i].by = CU.name; }
  else { DB.attendance.push({id:uid(), studentId:sid, date, status, by:CU.name, at:new Date().toISOString()}); }
  save(); render();
}

function setAllAtt(status){
  if(!can('manageAttendance')) return;
  studentsOfClass(attState.cls).forEach(s=>{
    const i = DB.attendance.findIndex(a=>a.studentId===s.id && a.date===attState.date);
    if(i>=0){ DB.attendance[i].status=status; DB.attendance[i].by=CU.name; }
    else DB.attendance.push({id:uid(), studentId:s.id, date:attState.date, status, by:CU.name, at:new Date().toISOString()});
  });
  save(); render(); toast('برای همه ثبت شد');
}

function vAttendance(){
  if(DB.classes.length===0) return '<div class="card neu"><div class="empty">ابتدا یک کلاس بسازید</div></div>';
  if(!attState.cls) attState.cls = DB.classes[0].id;

  const cards = list.map(s=>{

    return `<div class="att-card neu">

        <input type="date" value="${date}" onchange="attSet('date',this.value)"></label>
      ${editable ? `<button class="btn ok" onclick="setAllAtt('حاضر')">✅ همه حاضر</button>
      <button class="btn warn" onclick="setAllAtt('غایب')">❌ همه غایب</button>` : ''}

      <span class="chip">تاخیر: ${num(cnt('تاخیر'))}</span>
      <span class="chip">مرخصی: ${num(cnt('مرخصی'))}</span>
      <span class="chip">ثبت‌نشده: ${num(list.length - dayAtt.length)}</span>

        <tbody>${dayAtt.map(a=>{

function vSchedule(){
  const editable = can('manageExams');
  const clsOpts = DB.classes.map(c=>`<option value="${c.id}" ${state.cls===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const days = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه'];
  const periods = ['زنگ ۱','زنگ ۲','زنگ ۳','زنگ ۴'];

  let grid = `<div class="tt-grid"><div class="tt-cell head"></div>${days.map(d=>`<div class="tt-cell head">${d}</div>`).join('')}`;
  periods.forEach((p,pi)=>{
    grid += `<div class="tt-cell head">${p}</div>`;
    days.forEach((d,di)=>{
      const cell = DB.schedule.find(s=>s.classId===state.cls && s.day===di && s.period===pi);
      grid += `<div class="tt-cell">
        ${cell ? `<b>${esc(cell.subject)}</b><div class="sub">${esc(cell.teacher||'')}</div>` : '—'}
        ${editable ? `<button class="btn sm" style="margin-top:6px" onclick="editSchedule('${state.cls}',${di},${pi})">${cell?'✏️':'＋'}</button>` : ''}
      </div>`;
    });
  });
  grid += '</div>';

  return `
  <div class="card neu">
    <h3>⏰ برنامه هفتگی</h3>
    ${!editable ? `<div class="lock-notice">برای ویرایش باید دسترسی داشته باشید.</div>` : ''}
    <div class="toolbar">
      <label class="fld" style="min-width:220px"><span>کلاس</span>
        <select onchange="state.cls=this.value;render()">${clsOpts || '<option>—</option>'}</select></label>
    </div>
    ${DB.classes.length ? grid : '<div class="empty">ابتدا کلاس بسازید</div>'}
  </div>`;
}
function editSchedule(clsId, day, period){
  if(!can('manageExams')) return;
  const cell = DB.schedule.find(s=>s.classId===clsId && s.day===day && s.period===period);
  const html = `<div class="grid2">
    <label class="fld full"><span>درس</span><input name="sub" value="${esc(cell?.subject||'')}"></label>
    <label class="fld full"><span>دبیر</span><input name="tch" value="${esc(cell?.teacher||'')}"></label>
  </div>`;
  modal('⏰ برنامه', html, m=>{
    const sub = $('[name=sub]',m).value.trim();
    if(cell){ cell.subject = sub; cell.teacher = $('[name=tch]',m).value.trim(); }
    else if(sub) DB.schedule.push({id:uid(), classId:clsId, day, period, subject:sub, teacher:$('[name=tch]',m).value.trim()});
    save(); render(); toast('ثبت شد');
  });
}

        <select id="mScope" onchange="onScopeChange()">
          <option value="class">یک کلاس</option>

          <option value="student">دانش‌آموز خاص</option>
        </select></label>
      <label class="fld" id="mClsWrap"><span>کلاس</span><select id="mCls">${clsOpts}</select></label>
      <label class="fld" id="mStuWrap" style="display:none"><span>دانش‌آموز</span>

      <label class="fld full"><span>عنوان</span><input id="mTitle"></label>

function sendMsg(){
  if(!can('manageMessages')) return;
  const scope = $('#mScope').value;
  const title = $('#mTitle').value.trim();
  const body = $('#mBody').value.trim();
  if(!title || !body){ toast('عنوان و متن الزامی','bad'); return; }

  let students = [];
  if(scope==='class'){
    const cls = $('#mCls').value;
    if(!cls){ toast('کلاس را انتخاب کنید','bad'); return; }
    students = studentsOfClass(cls);
  } else if(scope==='all') {
    students = DB.students;
  } else {
    students = [getStudent($('#mStu').value)].filter(Boolean);
  }

  const parents = students.map(s=>parentUserOfStudent(s.id)).filter(Boolean);
  if(!parents.length){ toast('والدی برای این مخاطبین وجود ندارد','bad'); return; }

  const msg = {
    id:uid(), fromUserId:CU.id, fromName:CU.name,
    title, body, priority:$('#mPrio').value,
    date:isoToday(), dateTime:new Date().toISOString(),
    toStudentIds: students.map(s=>s.id),
    recipientParentIds: parents.map(p=>p.id),
    recipientCount: parents.length,
    readBy: [],
    targetLabel: scope==='class' ? getCls($('#mCls').value).name : scope==='all' ? 'همه والدین' : studentName($('#mStu').value),
    toStaffRoles: []
  };
  DB.messages.push(msg);
  save();
  $('#mTitle').value = ''; $('#mBody').value = '';
  toast(`پیام برای ${num(parents.length)} والد ارسال شد`,'ok');
  render();
}
function delMsg(id){
  if(!confirm('حذف شود؟')) return;
  DB.messages = DB.messages.filter(m=>m.id!==id);
  save(); render(); toast('حذف شد','warn');
}

function vParentMessages(){
  const s = getStudent(CU.studentId);
  if(!s) return '<div class="card neu"><div class="empty">—</div></div>';
  const myMsgs = DB.messages.filter(m=>m.toStudentIds?.includes(s.id)).slice().reverse();

  let changed = false;
  myMsgs.forEach(m=>{ if(!m.readBy) m.readBy=[]; if(!m.readBy.includes(CU.id)){ m.readBy.push(CU.id); changed=true; } });
  if(changed) save();

  const items = myMsgs.map(m=>{
    const hasObj = (m.objections||[]).some(o=>o.by===CU.id);
    return `<div class="msg-item ${m.priority==='urgent'?'urgent':m.priority==='high'?'high':''}">
      <div class="msg-head"><b>${esc(m.title)}</b>
        <span class="badge ${m.priority==='urgent'?'b-bad':m.priority==='high'?'b-warn':'b-mut'}">${m.priority==='urgent'?'فوری':m.priority==='high'?'مهم':'عادی'}</span></div>
      <div class="msg-body">${esc(m.body)}</div>
      <div class="msg-meta" style="margin-top:8px"><span>از: ${esc(m.fromName)}</span><span>${faDate(m.date)}</span>${hasObj?'<span class="badge b-info">اعتراض ثبت شده</span>':''}</div>
      <div style="margin-top:10px">
        ${hasObj ? '<div class="hint">شما اعتراض کرده‌اید. لطفاً به معاون آموزشی مراجعه کنید.</div>'
          : `<button class="btn sm warn" onclick="objectMsg('${m.id}')">⚠️ اعتراض به این پیام</button>`}
      </div>
    </div>`;
  }).join('');

  return `
  <div class="card neu">
    <h3>💬 پیام‌های دریافتی <span class="badge b-info">${num(myMsgs.length)}</span></h3>
    <div class="lock-notice">پیام‌رسان یک‌طرفه است. برای اعتراض روی دکمه بزنید.</div>
    ${items || '<div class="empty">پیامی دریافت نکرده‌اید</div>'}
  </div>`;
}
function objectMsg(msgId){
  const msg = DB.messages.find(m=>m.id===msgId); if(!msg) return;
  if(!msg.objections) msg.objections = [];
  if(msg.objections.some(o=>o.by===CU.id)) return;
  msg.objections.push({by:CU.id, name:CU.name, at:new Date().toISOString()});
  DB.objections.push({
    id:uid(), type:'message', refId:msg.id, refTitle:msg.title,
    studentId:CU.studentId, byName:CU.name, byUserId:CU.id,
    note:'اعتراض به پیام: '+msg.title,
    date:isoToday(), status:'باز', createdAt:new Date().toISOString()
  });
  save();
  modal('⚠️ اعتراض ثبت شد',`<div style="text-align:center;padding:10px 0">
    <div style="font-size:3rem">📮</div>
    <p style="font-size:1rem;font-weight:600;margin:10px 0">اعتراض شما ثبت شد.</p>
    <p class="hint">لطفاً به معاون آموزشی مدرسه مراجعه فرمایید.</p>
  </div>`, null, '', false);
  render();
}

function printAttendanceSheet(){
  if(!attState.cls) attState.cls = DB.classes[0]?.id;
  if(!attState.cls){ toast('کلاسی وجود ندارد','bad'); return; }
  const c = getCls(attState.cls);
  const all = studentsOfClass(attState.cls).sort((a,b)=>a.name.localeCompare(b.name,'fa'));
  const day = {};
  DB.attendance.filter(a=>a.date===attState.date).forEach(a=>day[a.studentId]=a.status);

  let cols=2, fs=10;
  const n = all.length;
  if(n>30){cols=2;fs=9;} if(n>50){cols=3;fs=8.5;} if(n>80){cols=3;fs=7.6;}
  if(n>120){cols=4;fs=6.9;} if(n>160){cols=4;fs=6.2;} if(n>200){cols=4;fs=5.6;}

  const rows = all.map((s,i)=>{
    const st = day[s.id] || '';
    const cOn = x => st===x ? 'on' : '';
    return `<div class="ps-row">
      <span class="ps-i">${toFa(i+1)}</span>
      <span class="ps-n">${esc(s.name)}</span>
      <span class="ps-s">
        <span class="ps-c ${cOn('حاضر')}">ح</span>
        <span class="ps-c ${cOn('غایب')}">غ</span>
        <span class="ps-c ${cOn('تاخیر')}">ت</span>
        <span class="ps-c ${cOn('مرخصی')}">م</span>
      </span>
    </div>`;
  }).join('');

  const cnt = st => all.filter(s=> day[s.id]===st).length;
  const ps = $('#printSheet');
  ps.style.setProperty('--cols', cols);
  ps.style.setProperty('--fs', fs+'pt');

  ps.innerHTML = `
    <div class="ps-head">
      <div class="ps-h1">
        <span>${esc(DB.settings.school||'هنرستان')}</span>
        <span>سال ${esc(DB.settings.year||'')}</span>
      </div>
      <div class="ps-h2">فرم حضور کلاس: <b>${esc(c.name)}</b> — تاریخ: <b>${faDate(attState.date)}</b></div>
      <div class="ps-h3">
        <span>تعداد: ${num(all.length)}</span><span>حاضر: ${num(cnt('حاضر'))}</span>
        <span>غایب: ${num(cnt('غایب'))}</span><span>تاخیر: ${num(cnt('تاخیر'))}</span>
        <span>مرخصی: ${num(cnt('مرخصی'))}</span>
      </div>
      <div class="ps-legend">ح=حاضر غ=غایب ت=تاخیر م=مرخصی</div>
    </div>
    <div class="ps-body">${rows || '<div class="empty">دانش‌آموزی نیست</div>'}</div>
    <div class="ps-foot">
      <div>امضای دبیر: <span class="ps-sign"></span></div>
      <div>مهر مدرسه</div>
    </div>`;
  setTimeout(()=>window.print(), 50);
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){ toast('کتابخانه اکسل بارگذاری نشد','bad'); return; }
  const wb = XLSX.utils.book_new();

  const s1 = [['نام','کد ملی','موبایل','کلاس','رشته','شهریه','تخفیف','پرداختی','مانده']];
  DB.students.forEach(s=>{
    const c = getCls(s.classId);
    s1.push([s.name, s.nid, s.mobile, c.name, c.field, s.fee||0, discountOf(s.id), paidOf(s.id), remainingOf(s)]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s1), 'دانش‌آموزان');

  const s2 = [['نام','کد ملی','موبایل','نقش']];
  DB.teachers.forEach(t=> s2.push([t.name, t.nid, t.mobile, t.role]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s2), 'دبیران');

  const s3 = [['کاربری','رمز','نام','نقش','فعال']];
  DB.users.forEach(u=> s3.push([u.username, u.password, u.name, ROLES[u.role].label, u.active?'بله':'خیر']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s3), 'کاربران');

  const s4 = [['دانش‌آموز','کلاس','تاریخ','وضعیت','ثبت‌کننده']];
  DB.attendance.forEach(a=>{
    const s = getStudent(a.studentId); if(!s) return;
    s4.push([s.name, getCls(s.classId).name, a.date, a.status, a.by||'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s4), 'حضور');

  const s5 = [['دانش‌آموز','درس','نیمسال','نمره','تاریخ']];
  DB.grades.forEach(g=>{
    const s = getStudent(g.studentId);
    s5.push([s?s.name:'—', g.subject, g.term, g.score, g.date]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s5), 'نمرات');

  const s6 = [['دانش‌آموز','مبلغ','تاریخ','توضیح']];
  DB.payments.forEach(p=>{
    const s = getStudent(p.studentId);
    s6.push([s?s.name:'—', p.amount, p.date, p.desc||'']);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s6), 'پرداخت‌ها');

  XLSX.writeFile(wb, `school-${isoToday()}.xlsx`);
  toast('اکسل دانلود شد');
}

function handleFile(file){
  if(!requireAdmin('ورود اکسل فقط توسط مدیر')) return;
  if(typeof XLSX === 'undefined'){ toast('کتابخانه اکسل موجود نیست','bad'); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      importWorkbook(wb);
    }catch(err){ console.error(err); toast('خطا در خواندن','bad'); }
  };
  reader.readAsArrayBuffer(file);
}

function importWorkbook(wb){
  let nS = 0, nT = 0;
  const existingStudents = new Set(DB.students.map(s=>s.name+s.classId));
  const existingTeachers = new Set(DB.teachers.map(t=>t.name));
  const existingUsers = new Set(DB.users.map(u=>u.username));

  wb.SheetNames.forEach(sn=>{
    const ws = wb.Sheets[sn]; if(!ws) return;
    const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
    if(!rows.length) return;

    let cls = DB.classes.find(c=>normName(c.name)===normName(sn));
    if(!cls){
      const grade = ['دوازدهم','یازدهم','دهم'].find(g=>normName(sn).includes(g));
      const field = grade ? normName(sn).replace(grade,'').trim() : normName(sn);
      cls = DB.classes.find(c=>c.grade===grade && normName(c.field)===field);
    }

    let hi=-1, kind='';
    for(let i=0;i<Math.min(rows.length,12);i++){
      const r = rows[i].map(c=>String(c||''));
      if(r.some(c=>c.includes('نام پرسنل'))){ hi=i; kind='t'; break; }
      if(r.some(c=>c.includes('نام دانش')||c.includes('نام و نام خانوادگی'))){ hi=i; kind='s'; break; }
    }
    if(hi<0) return;

    if(kind==='t'){
      for(let i=hi+1;i<rows.length;i++){
        const r = rows[i]; if(!r) continue;
        const name = [r[0],r[1]].map(x=>String(x||'').trim()).filter(Boolean).join(' ');
        if(!name || existingTeachers.has(name)) continue;
        const mobile = String(r[2]||'').trim();
        const nid = String(r[3]||'').trim();
        const role = String(r[4]||'دبیر').trim() || 'دبیر';
        const t = {id:uid(), name, mobile, nid, role};
        DB.teachers.push(t);
        const base = mobile||nid||('t'+Math.random().toString(36).slice(2,7));
        const un = makeUsername(base, existingUsers);
        const pw = mobile && mobile.length>=4 ? mobile.slice(-4) : '1234';
        DB.users.push({id:uid(), username:un, password:pw,
          role: role.includes('دبیر')?'teacher':'staff', name, teacherId:t.id, active:true});
        nT++;
      }
    } else if(cls) {
      for(let i=hi+1;i<rows.length;i++){
        const r = rows[i]; if(!r) continue;
        const name = [r[0],r[1]].map(x=>String(x||'').trim()).filter(Boolean).join(' ');
        if(!name || existingStudents.has(name+cls.id)) continue;
        const nid = String(r[2]||'').trim();
        const mobile = String(r[5]||'').trim()||String(r[8]||'').trim();
        const s = {id:uid(), name, nid, mobile, classId:cls.id, fee:0, guardian:'', note:''};
        DB.students.push(s);
        const base = mobile||nid||('p'+Math.random().toString(36).slice(2,7));
        const un = makeUsername(base, existingUsers);
        const pw = mobile && mobile.length>=4 ? mobile.slice(-4) : (nid && nid.length>=4 ? nid.slice(-4) : '1234');
        DB.users.push({id:uid(), username:un, password:pw, role:'parent', name:'ولی '+name, studentId:s.id, active:true});
        nS++;
      }
    }
  });
  save(); render();
  toast(`${num(nS)} دانش‌آموز و ${num(nT)} دبیر اضافه شد`,'ok');
}

document.addEventListener('change', e=>{
  if(e.target && e.target.id === 'xlsIn'){
    const f = e.target.files[0]; if(f) handleFile(f);
    e.target.value = '';
  }
  if(e.target && e.target.id === 'jsonIn'){
    if(!requireAdmin()) { e.target.value=''; return; }
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ev=>{
      try{
        const obj = JSON.parse(ev.target.result);
        if(!obj.users) throw 0;
        DB = obj; migrate(); save(); render(); toast('بازیابی انجام شد');
      }catch(err){ toast('فایل معتبر نیست','bad'); }
    };
    rd.readAsText(f);
    e.target.value = '';
  }
});
